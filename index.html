<style>
:root{--navy:#0d3563;--navy2:#153f73;--yellow:#f4bd24;--bg:#f4f7fb;--card:#fff;--text:#162033;--muted:#687387;--line:#dbe3ed;--ok:#16835b;--warn:#b46d00;--danger:#b43f3f;--shadow:0 8px 24px rgba(13,53,99,.09);--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;padding-bottom:max(84px,calc(72px + env(safe-area-inset-bottom)))}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:0 auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-top))}.brand{display:flex;align-items:center;gap:12px}.brand img{width:150px;max-height:58px;object-fit:contain;object-position:left center}.brand-copy{margin-left:auto;text-align:right}.brand-copy b{display:block;color:var(--navy);font-size:13px}.brand-copy span{font-size:11px;color:var(--muted)}
main{padding:16px}.screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(145deg,var(--navy),#0a2a4f);color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:160px;height:160px;border:34px solid rgba(244,189,36,.15);border-radius:50%;right:-60px;top:-80px}.hero .eyebrow{font-size:12px;color:#f9d96f;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.hero h1{margin:7px 0 6px;font-size:28px;line-height:1.05}.hero p{margin:0;color:#dbe7f4;font-size:14px;max-width:420px}.hero-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:750;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:var(--yellow);color:#17345a}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.ghost{background:#eef3f8;color:var(--navy)}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #f1c2c2}.btn.small{padding:9px 11px;min-height:38px;border-radius:12px;font-size:13px}.btn.wide{width:100%}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}.section-title h2{margin:0;font-size:18px;color:var(--navy)}.section-title .sub{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 3px 14px rgba(13,53,99,.04);padding:16px;margin-bottom:12px}.card.clickable:active{transform:scale(.995)}.empty{text-align:center;color:var(--muted);padding:28px 14px}.empty .icon{font-size:32px;margin-bottom:8px}.job-card h3,.room-card h3{margin:0;color:var(--navy);font-size:17px}.row{display:flex;align-items:center;gap:10px}.row.between{justify-content:space-between}.meta{font-size:12px;color:var(--muted);margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.chip{background:#eef4fa;color:#335272;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:650}.chip.yellow{background:#fff3bf;color:#725000}.chip.ok{background:#e7f6ef;color:#126645}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:750;color:#47617e;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd7e4;border-radius:13px;background:#fff;color:var(--text);padding:12px 13px;outline:none;min-height:46px}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6a8bb0;box-shadow:0 0 0 3px rgba(13,53,99,.07)}.field .hint{font-size:11px;color:var(--muted);margin-top:5px}.inline2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inline3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}.step{background:#eaf0f6;color:#6c7c90;padding:9px 6px;border-radius:12px;text-align:center;font-size:11px;font-weight:750}.step.active{background:var(--navy);color:#fff}.step.done{background:#e4f3ec;color:#176848}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:20px}.page-head h1{margin:0;color:var(--navy);font-size:22px}.page-head .grow{flex:1}.save-pill{font-size:11px;color:#16704d;background:#e6f4ed;padding:6px 9px;border-radius:999px;opacity:0;transition:.2s}.save-pill.show{opacity:1}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.metric{border-radius:15px;background:#f5f8fb;padding:12px}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{display:block;color:var(--navy);font-size:19px;margin-top:3px}.metric.highlight{background:#fff3c9}.metric.highlight b{color:#765400}
.list-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid #edf1f5;padding:12px 0}.list-row:first-child{border-top:0}.list-row b{color:var(--navy);font-size:14px}.list-row small{display:block;color:var(--muted);margin-top:3px}.icon-btn{width:38px;height:38px;border:0;border-radius:12px;background:#f0f4f8;color:var(--navy);font-size:16px}.icon-btn.danger{background:#fff0f0;color:var(--danger)}
.auto-box{background:#fff7d8;border:1px solid #f1d46e;border-radius:15px;padding:12px;margin-top:10px}.auto-box b{color:#745600}.auto-actions{display:flex;gap:8px;margin-top:9px}.work-item{padding:13px 0;border-top:1px solid #edf1f5}.work-item:first-child{border-top:0}.work-top{display:flex;gap:8px;align-items:flex-start}.work-top .grow{flex:1}.qty{font-weight:800;color:var(--navy);white-space:nowrap}.work-note{font-size:11px;color:var(--muted);margin-top:5px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.photo{aspect-ratio:1;border-radius:13px;overflow:hidden;position:relative;background:#e8edf3}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:5px;top:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(20,30,45,.74);color:#fff}.photo-add{aspect-ratio:1;border-radius:13px;border:1.5px dashed #aab7c6;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--navy);font-size:12px;font-weight:700}.photo-add span{font-size:25px;margin-bottom:3px}
.summary-room{border-left:4px solid var(--yellow);padding-left:12px;margin:15px 0}.summary-room h3{margin:0;color:var(--navy)}.summary-room .dims{font-size:12px;color:var(--muted);margin:3px 0 8px}.summary-work{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #edf1f5;font-size:13px}.summary-work:first-of-type{border-top:0}.summary-work b{color:var(--navy);text-align:right}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px max(8px,env(safe-area-inset-bottom))}.bottom-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.navbtn{border:0;background:transparent;border-radius:12px;padding:7px 6px;color:#7a8797;font-size:11px;font-weight:650}.navbtn span{display:block;font-size:21px;line-height:1.2}.navbtn.active{color:var(--navy);background:#eef4fa}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#17283b;color:#fff;padding:11px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:12px 0}.danger-zone{border-color:#efd0d0}.muted{color:var(--muted)}.small{font-size:12px}
.pwa-card{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.pwa-dot{width:11px;height:11px;border-radius:50%;background:#21a06b;margin-top:4px;box-shadow:0 0 0 4px rgba(33,160,107,.12);flex:0 0 auto}
.pwa-card b{display:block;color:var(--navy);font-size:13px}.pwa-card p{margin:3px 0 0;color:var(--muted);font-size:12px;line-height:1.35}
.install-hint{margin-top:10px;background:#fff7d8;border:1px solid #f1d46e;border-radius:14px;padding:11px 12px;font-size:12px;color:#684f00}
.net-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 8px;border-radius:999px;background:#e7f6ef;color:#126645}.net-pill.offline{background:#fff3bf;color:#725000}
@media(min-width:640px){main{padding:22px}.form-grid.two{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(4,1fr)}.photo-grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><img src="assets/logo.jpg" alt="Instivio"><div class="brand-copy"><b>OGLĘDZINY</b><span>wersja 0.2 PWA · <span id="netState">online</span></span></div></div></header>
<main>
  <section id="home" class="screen active"></section>
  <section id="job" class="screen"></section>
  <section id="room" class="screen"></section>
  <section id="summary" class="screen"></section>
</main>
</div>
<div class="bottom-nav"><div class="bottom-inner">
  <button class="navbtn active" data-nav="home"><span>⌂</span>Zlecenia</button>
  <button class="navbtn" data-nav="job"><span>＋</span>Oględziny</button>
  <button class="navbtn" data-nav="summary"><span>✓</span>Podsumowanie</button>
</div></div>
<div id="toast" class="toast"></div>
<script>
const STORAGE='instivio-ogledziny-v01';
const roomNames=['Salon','Kuchnia','Łazienka','Toaleta','Pokój 1','Pokój 2','Pokój 3','Pokój 4','Pokój 5','Pokój 6','Garderoba','Przedpokój','Wiatrołap','Klatka schodowa','Biuro / gabinet','Pralnia','Spiżarnia','Kotłownia','Piwnica','Garaż','Poddasze / strych','Balkon / taras','Inne'];
const catalog={
'Gładzie':[
 {n:'Gładź gipsowa – 2 warstwy + szlifowanie',u:'m²',b:'walls'},
 {n:'Gładź na suficie',u:'m²',b:'ceiling'},
 {n:'Gładź – standard premium pod lampę smugową / światło boczne',u:'m²',b:'walls'},
 {n:'Gruntowanie podłoża pod gładź',u:'m²',b:'walls'}],
'Malowanie':[
 {n:'Malowanie ścian – 2 warstwy, 1 kolor',u:'m²',b:'walls'},
 {n:'Malowanie sufitu – 2 warstwy',u:'m²',b:'ceiling'},
 {n:'Gruntowanie ścian i sufitów',u:'m²',b:'wallsceil'},
 {n:'Zabezpieczenie podłogi do malowania',u:'m²',b:'floor'}],
'Malowanie natryskowe':[
 {n:'Malowanie natryskowe ścian – 2 warstwy',u:'m²',b:'walls'},
 {n:'Malowanie natryskowe sufitów – 2 warstwy',u:'m²',b:'ceiling'},
 {n:'Zabezpieczenie do malowania natryskowego',u:'m²',b:'floor'}],
'Podłogi':[
 {n:'Układanie paneli podłogowych – click',u:'m²',b:'floor'},
 {n:'Układanie paneli winylowych – click',u:'m²',b:'floor'},
 {n:'Układanie podkładu pod panele',u:'m²',b:'floor'},
 {n:'Montaż listew MDF',u:'mb',b:'perimeter'}],
'GK / suche zabudowy':[
 {n:'Wyrównanie ściany płytą GK – klejenie',u:'m²',b:'walls'},
 {n:'Przedścianka GK na stelażu',u:'m²',b:'walls'},
 {n:'Sufit podwieszany GK – jednopoziomowy',u:'m²',b:'ceiling'},
 {n:'Ścianka działowa GK',u:'m²',b:'manual'}],
'Glazura / płytki':[
 {n:'Układanie płytek – standardowe wymiary',u:'m²',b:'manual'},
 {n:'Hydroizolacja podpłytkowa – 2 warstwy',u:'m²',b:'manual'},
 {n:'Fugowanie płytek',u:'m²',b:'manual'},
 {n:'Silikonowanie naroży i styków',u:'mb',b:'manual'}],
'Elektryka':[
 {n:'Wykonanie punktu elektrycznego',u:'szt.',b:'manual'},
 {n:'Wymiana gniazda / łącznika',u:'szt.',b:'manual'},
 {n:'Bruzda pod przewody – cegła / beton komórkowy',u:'mb',b:'manual'},
 {n:'Montaż oprawy oświetleniowej',u:'szt.',b:'manual'}],
'Stolarka':[
 {n:'Kompletny montaż drzwi wewnętrznych',u:'kpl.',b:'manual'},
 {n:'Demontaż futryny / ościeżnicy standardowej',u:'szt.',b:'manual'},
 {n:'Montaż parapetu wewnętrznego PCV / MDF / laminowanego',u:'szt.',b:'manual'}],
'Biały montaż / wyposażenie':[
 {n:'Montaż umywalki z szafką',u:'kpl.',b:'manual'},
 {n:'Montaż WC podwieszanego',u:'szt.',b:'manual'},
 {n:'Montaż stelaża podtynkowego / Geberit',u:'szt.',b:'manual'},
 {n:'Montaż kabiny prysznicowej',u:'szt.',b:'manual'}],
'Demontaże / budowlane':[
 {n:'Demontaż ścianki GK',u:'m²',b:'manual'},
 {n:'Rozbiórka ścianki z cegły / bloczków',u:'m²',b:'manual'},
 {n:'Skuwanie / usuwanie starej wylewki',u:'m²',b:'floor'},
 {n:'Wyniesienie gruzu / odpadów budowlanych – parter lub winda',u:'m³',b:'manual'}],
'Tynki / tapety':[
 {n:'Tynki gipsowe',u:'m²',b:'walls'},
 {n:'Tapetowanie – tapeta standardowa bez spasowania wzoru',u:'m²',b:'walls'},
 {n:'Zrywanie starych tapet',u:'m²',b:'walls'}],
'Drobne wod-kan':[
 {n:'Przesunięcie podejścia wody',u:'pkt',b:'manual'},
 {n:'Przesunięcie odpływu',u:'pkt',b:'manual'},
 {n:'Punkt wod-kan / hydrauliczny',u:'pkt',b:'manual'}],
'Montaż / dekoracje':[
 {n:'Montaż lameli dekoracyjnych',u:'m²',b:'manual'},
 {n:'Montaż telewizora na uchwycie',u:'szt.',b:'manual'},
 {n:'Montaż półki ściennej',u:'szt.',b:'manual'}],
'Diagnostyka':[
 {n:'Diagnostyka usterki instalacji elektrycznej',u:'r-g',b:'manual'},
 {n:'Skanowanie ściany przed wierceniem',u:'pkt',b:'manual'}],
'Fotowoltaika':[
 {n:'Diagnostyka instalacji PV',u:'kpl.',b:'manual'},
 {n:'Kompleksowy montaż instalacji PV – dach',u:'kWp',b:'manual'},
 {n:'Montaż i uruchomienie magazynu energii – standard',u:'kpl.',b:'manual'}],
'Prace niestandardowe':[{n:'Prace niestandardowe – zakres indywidualny',u:'ryczałt',b:'manual'}]
};
let state=load(); let currentJobId=state.currentJobId||null; let currentRoomId=null; let currentScreen='home';
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||{jobs:[],currentJobId:null}}catch(e){return{jobs:[],currentJobId:null}}}
function save(){state.currentJobId=currentJobId;localStorage.setItem(STORAGE,JSON.stringify(state));flashSaved()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:0}
function fmt(v){return (Math.round((num(v)+Number.EPSILON)*100)/100).toFixed(2).replace('.',',')}
function job(){return state.jobs.find(j=>j.id===currentJobId)}
function room(){const j=job();return j?.rooms.find(r=>r.id===currentRoomId)}
function metrics(r){const L=num(r.length),W=num(r.width),H=num(r.height);const floor=L*W, ceiling=floor, perimeter=2*(L+W), grossWalls=perimeter*H;const openings=(r.openings||[]).reduce((s,o)=>s+num(o.width)*num(o.height)*Math.max(1,num(o.count)),0);return{floor,ceiling,perimeter,grossWalls,openings,netWalls:Math.max(0,grossWalls-openings),wallsceil:Math.max(0,grossWalls-openings)+ceiling}}
function basisQty(r,b){const m=metrics(r);return b==='walls'?m.netWalls:b==='ceiling'?m.ceiling:b==='floor'?m.floor:b==='perimeter'?m.perimeter:b==='wallsceil'?m.wallsceil:0}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),1800)}
function flashSaved(){document.querySelectorAll('.save-pill').forEach(x=>{x.classList.add('show');setTimeout(()=>x.classList.remove('show'),800)})}
function go(screen){if(screen==='job'&&!currentJobId){newJob();return} if(screen==='summary'&&!currentJobId){toast('Najpierw wybierz zlecenie');screen='home'} currentScreen=screen;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(screen).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.nav===screen));render()}
function newJob(){const j={id:uid(),number:'OGL/'+new Date().getFullYear()+'/'+String(state.jobs.length+1).padStart(3,'0'),client:'',phone:'',address:'',visitDate:today(),plannedStart:'',notes:'',rooms:[],createdAt:new Date().toISOString()};state.jobs.unshift(j);currentJobId=j.id;save();currentScreen='job';go('job')}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function updatePWAStatus(){
 const net=document.getElementById('netState'); if(net) net.textContent=navigator.onLine?'online':'offline';
 const hint=document.getElementById('installHint'); if(!hint)return;
 if(isStandalone()){hint.innerHTML='✓ Aplikacja jest uruchomiona z ekranu początkowego.';return}
 if(isIOS()){hint.innerHTML='Na iPhonie: otwórz tę stronę w <b>Safari</b> → <b>Udostępnij</b> → <b>Dodaj do ekranu początkowego</b>.'}
 else{hint.innerHTML='W przeglądarce wybierz opcję <b>Zainstaluj aplikację</b> / <b>Dodaj do ekranu głównego</b>.'}
}
function render(){renderHome();renderJob();renderRoom();renderSummary();updatePWAStatus()}
function renderHome(){const el=document.getElementById('home');const jobs=state.jobs;el.innerHTML=`
<div class="hero"><div class="eyebrow">INSTIVIO OGLĘDZINY</div><h1>Pomiary bez kartki i przepisywania.</h1><p>Klient, pomieszczenia, metry, zakres prac, zdjęcia i notatki — wszystko w jednym miejscu.</p><div class="hero-actions"><button class="btn primary" onclick="newJob()">＋ Nowe oględziny</button><button class="btn secondary" onclick="loadDemo()">▶ Wczytaj demo</button></div></div>
<div class="pwa-card"><div class="pwa-dot"></div><div><b>Tryb aplikacji + offline</b><p>Po pierwszym uruchomieniu z internetu podstawowy interfejs działa także bez zasięgu. Dane oględzin są zapisywane na urządzeniu.</p><div id="installHint" class="install-hint"></div></div></div>
<div class="section-title"><h2>Ostatnie oględziny</h2><span class="sub">${jobs.length} zapisanych</span></div>
${jobs.length?jobs.map(j=>{const works=j.rooms.reduce((s,r)=>s+(r.works?.length||0),0);return`<div class="card clickable job-card" onclick="openJob('${j.id}')"><div class="row between"><div><h3>${esc(j.client||'Nowy klient')}</h3><div class="meta">${esc(j.address||'Brak adresu')} · ${esc(j.visitDate||'')}</div></div><button class="icon-btn">›</button></div><div class="chips"><span class="chip">${j.rooms.length} pom.</span><span class="chip">${works} prac</span><span class="chip yellow">${esc(j.number)}</span></div></div>`}).join(''):`<div class="card empty"><div class="icon">⌂</div><b>Brak oględzin</b><div class="small">Dodaj pierwsze zlecenie i przejdź przez cały proces.</div></div>`}`}
function openJob(id){currentJobId=id;currentRoomId=null;save();go('job')}
function renderJob(){const el=document.getElementById('job');const j=job();if(!j){el.innerHTML='';return} el.innerHTML=`
<div class="page-head"><button class="back" onclick="go('home')">‹</button><div class="grow"><h1>${esc(j.client||'Nowe oględziny')}</h1><div class="meta">${esc(j.number)}</div></div><span class="save-pill">Zapisano</span></div>
<div class="steps"><div class="step active">1. Klient</div><div class="step ${j.rooms.length?'done':''}">2. Pomieszczenia</div><div class="step">3. Podsumowanie</div></div>
<div class="card"><div class="form-grid two">
<div class="field"><label>Klient / inwestor</label><input data-j="client" value="${esc(j.client)}" placeholder="np. Anna Kowalska"></div>
<div class="field"><label>Telefon</label><input data-j="phone" type="tel" value="${esc(j.phone)}" placeholder="500 000 000"></div>
<div class="field"><label>Adres realizacji</label><input data-j="address" value="${esc(j.address)}" placeholder="Miejscowość, ulica"></div>
<div class="field"><label>Data oględzin</label><input data-j="visitDate" type="date" value="${esc(j.visitDate)}"></div>
<div class="field"><label>Planowany start</label><input data-j="plannedStart" type="date" value="${esc(j.plannedStart)}"></div>
<div class="field"><label>Numer oględzin</label><input value="${esc(j.number)}" disabled></div>
</div><div class="field" style="margin-top:12px"><label>Uwagi ogólne</label><textarea data-j="notes" placeholder="Dostęp, piętro, parking, klucze, wymagania klienta…">${esc(j.notes)}</textarea></div></div>
<div class="section-title"><h2>Pomieszczenia</h2><button class="btn small primary" onclick="addRoom()">＋ Dodaj</button></div>
${j.rooms.length?j.rooms.map(r=>{const m=metrics(r);return`<div class="card room-card clickable" onclick="openRoom('${r.id}')"><div class="row between"><div><h3>${esc(r.name||'Pomieszczenie')}</h3><div class="meta">${fmt(m.floor)} m² podłogi · ${fmt(m.netWalls)} m² ścian netto</div></div><button class="icon-btn">›</button></div><div class="chips"><span class="chip">${r.works?.length||0} prac</span><span class="chip">${r.photos?.length||0} zdjęć</span>${r.length&&r.width?`<span class="chip ok">pomierzone</span>`:''}</div></div>`}).join(''):`<div class="card empty"><div class="icon">▦</div><b>Dodaj pierwsze pomieszczenie</b><div class="small">Tu będziemy liczyć ściany, sufit i podłogę.</div></div>`}
<button class="btn wide secondary" onclick="go('summary')">Przejdź do podsumowania →</button>
<div class="card danger-zone" style="margin-top:18px"><div class="row between"><div><b>Usuń oględziny</b><div class="meta">Usunie dane tylko z tego telefonu.</div></div><button class="btn small danger" onclick="deleteJob()">Usuń</button></div></div>`;
el.querySelectorAll('[data-j]').forEach(i=>i.addEventListener('input',e=>{j[e.target.dataset.j]=e.target.value;save();if(e.target.dataset.j==='client')document.querySelector('.page-head h1').textContent=e.target.value||'Nowe oględziny'}))}
function addRoom(){const j=job();if(!j)return;const r={id:uid(),name:'Salon',length:'',width:'',height:'2.60',notes:'',openings:[],works:[],photos:[]};j.rooms.push(r);currentRoomId=r.id;save();go('room')}
function openRoom(id){currentRoomId=id;go('room')}
function renderRoom(){const el=document.getElementById('room');const r=room(),j=job();if(!r||!j){el.innerHTML='';return}const m=metrics(r);el.innerHTML=`
<div class="page-head"><button class="back" onclick="go('job')">‹</button><div class="grow"><h1>${esc(r.name||'Pomieszczenie')}</h1><div class="meta">${esc(j.client||j.number)}</div></div><span class="save-pill">Zapisano</span></div>
<div class="card"><div class="inline2"><div class="field"><label>Nazwa pomieszczenia</label><select data-r="name">${roomNames.map(n=>`<option ${n===r.name?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Wysokość [m]</label><input data-r="height" inputmode="decimal" value="${esc(r.height)}"></div></div>
<div class="inline2" style="margin-top:10px"><div class="field"><label>Długość [m]</label><input data-r="length" inputmode="decimal" value="${esc(r.length)}" placeholder="4,20"></div><div class="field"><label>Szerokość [m]</label><input data-r="width" inputmode="decimal" value="${esc(r.width)}" placeholder="3,60"></div></div>
<div class="metrics"><div class="metric"><span>Podłoga</span><b>${fmt(m.floor)} m²</b></div><div class="metric"><span>Sufit</span><b>${fmt(m.ceiling)} m²</b></div><div class="metric"><span>Ściany brutto</span><b>${fmt(m.grossWalls)} m²</b></div><div class="metric highlight"><span>Ściany netto</span><b>${fmt(m.netWalls)} m²</b></div></div></div>
<div class="section-title"><h2>Otwory</h2><button class="btn small ghost" onclick="addOpening()">＋ Okno / drzwi</button></div>
<div class="card" id="openings">${r.openings.length?r.openings.map((o,idx)=>`<div class="list-row"><div><b>${esc(o.type)}</b><small>${fmt(o.width)} × ${fmt(o.height)} m × ${o.count||1} = ${fmt(num(o.width)*num(o.height)*Math.max(1,num(o.count)))} m²</small></div><button class="icon-btn danger" onclick="removeOpening(${idx})">×</button></div>`).join(''):`<div class="empty small">Brak otworów. Ściany netto = ściany brutto.</div>`}</div>
<div class="section-title"><h2>Zakres prac</h2><span class="sub">${r.works.length} pozycji</span></div>
<div class="card"><div class="inline2"><div class="field"><label>Kategoria</label><select id="workCat">${Object.keys(catalog).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Usługa</label><select id="workService"></select></div></div><div id="autoSuggest"></div><div class="inline2" style="margin-top:10px"><div class="field"><label>Ilość</label><input id="workQty" inputmode="decimal" placeholder="0,00"></div><div class="field"><label>Jm.</label><input id="workUnit" disabled></div></div><div class="field" style="margin-top:10px"><label>Uwagi do pozycji</label><input id="workNote" placeholder="np. ściana przy oknie, klient wybiera kolor"></div><button class="btn wide primary" style="margin-top:12px" onclick="addWork()">＋ Dodaj do zakresu</button></div>
${r.works.length?`<div class="card">${r.works.map((w,idx)=>`<div class="work-item"><div class="work-top"><div class="grow"><b>${esc(w.service)}</b><div class="meta">${esc(w.category)}</div>${w.note?`<div class="work-note">${esc(w.note)}</div>`:''}</div><div class="qty">${fmt(w.qty)} ${esc(w.unit)}</div><button class="icon-btn danger" onclick="removeWork(${idx})">×</button></div></div>`).join('')}</div>`:''}
<div class="section-title"><h2>Zdjęcia</h2><span class="sub">${r.photos.length} dodanych</span></div>
<div class="card"><div class="photo-grid">${r.photos.map((p,idx)=>`<div class="photo"><img src="${p.data}" alt="Zdjęcie"><button onclick="removePhoto(${idx})">×</button></div>`).join('')}<label class="photo-add"><span>＋</span>Dodaj<input class="hidden" type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(this.files)"></label></div><div class="hint small muted" style="margin-top:9px">W prototypie zdjęcia są kompresowane i zapisywane lokalnie w telefonie.</div></div>
<div class="card"><div class="field"><label>Notatka do pomieszczenia</label><textarea data-r="notes" placeholder="Np. ściana przy oknie odchylona ok. 4 cm…">${esc(r.notes)}</textarea></div></div>
<button class="btn wide secondary" onclick="go('job')">✓ Zapisz pomieszczenie</button>`;
wireRoomFields();wireWorkSelectors()}
function wireRoomFields(){const r=room();document.querySelectorAll('[data-r]').forEach(i=>i.addEventListener('input',e=>{r[e.target.dataset.r]=e.target.value;save();renderRoom()}))}
function addOpening(){const r=room();const type=prompt('Typ otworu: okno / drzwi','Okno');if(type===null)return;const width=prompt('Szerokość [m]','1.50');if(width===null)return;const height=prompt('Wysokość [m]','1.40');if(height===null)return;const count=prompt('Ilość','1');r.openings.push({type:type||'Otwór',width,height,count:count||'1'});save();renderRoom()}
function removeOpening(i){room().openings.splice(i,1);save();renderRoom()}
function wireWorkSelectors(){const cat=document.getElementById('workCat'),svc=document.getElementById('workService');if(!cat||!svc)return;const refresh=()=>{svc.innerHTML=catalog[cat.value].map((s,i)=>`<option value="${i}">${esc(s.n)}</option>`).join('');syncWork()};cat.onchange=refresh;svc.onchange=syncWork;refresh()}
function syncWork(){const cat=document.getElementById('workCat'),svc=document.getElementById('workService'),q=document.getElementById('workQty'),u=document.getElementById('workUnit'),box=document.getElementById('autoSuggest');if(!cat||!svc)return;const s=catalog[cat.value][Number(svc.value)||0];u.value=s.u;const auto=basisQty(room(),s.b);if(auto>0){q.value=fmt(auto);const labels={walls:'ściany netto',ceiling:'sufit',floor:'podłoga',perimeter:'obwód',wallsceil:'ściany netto + sufit'};box.innerHTML=`<div class="auto-box"><b>Automatyczna ilość: ${fmt(auto)} ${s.u}</b><div class="small">Na podstawie: ${labels[s.b]||'pomiar'}. Możesz ją ręcznie zmienić.</div></div>`}else{q.value='';box.innerHTML='<div class="auto-box"><b>Ilość ręczna</b><div class="small">Ta usługa nie ma jeszcze automatycznego przelicznika.</div></div>'}}
function addWork(){const cat=document.getElementById('workCat'),svc=document.getElementById('workService'),q=document.getElementById('workQty'),u=document.getElementById('workUnit'),note=document.getElementById('workNote');const s=catalog[cat.value][Number(svc.value)||0],qty=num(q.value);if(!qty){toast('Wpisz ilość');return}room().works.push({id:uid(),category:cat.value,service:s.n,qty,unit:s.u,note:note.value||'',basis:s.b});save();toast('Dodano pozycję');renderRoom()}
function removeWork(i){room().works.splice(i,1);save();renderRoom()}
async function addPhotos(files){const r=room();for(const f of [...files].slice(0,6)){try{const data=await compressImage(f);r.photos.push({id:uid(),name:f.name,data})}catch(e){toast('Nie udało się dodać zdjęcia')}}try{save()}catch(e){toast('Pamięć telefonu jest pełna dla zdjęć')}renderRoom()}
function compressImage(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onerror=reject;fr.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.68))};img.src=fr.result};fr.readAsDataURL(file)})}
function removePhoto(i){room().photos.splice(i,1);save();renderRoom()}
function renderSummary(){const el=document.getElementById('summary'),j=job();if(!j){el.innerHTML='<div class="card empty"><b>Brak wybranego zlecenia</b></div>';return}const totalWorks=j.rooms.reduce((s,r)=>s+r.works.length,0);el.innerHTML=`
<div class="page-head"><button class="back" onclick="go('job')">‹</button><div class="grow"><h1>Podsumowanie</h1><div class="meta">${esc(j.client||j.number)}</div></div><span class="save-pill">Zapisano</span></div>
<div class="steps"><div class="step done">1. Klient</div><div class="step done">2. Pomieszczenia</div><div class="step active">3. Podsumowanie</div></div>
<div class="card"><div class="row between"><div><b>${esc(j.client||'Klient')}</b><div class="meta">${esc(j.address||'Brak adresu')} · ${esc(j.phone||'brak telefonu')}</div></div><span class="chip yellow">${esc(j.number)}</span></div><div class="chips"><span class="chip">${j.rooms.length} pomieszczeń</span><span class="chip">${totalWorks} pozycji prac</span><span class="chip">${j.rooms.reduce((s,r)=>s+r.photos.length,0)} zdjęć</span></div></div>
${j.rooms.map(r=>{const m=metrics(r);return`<div class="card"><div class="summary-room"><h3>${esc(r.name)}</h3><div class="dims">${fmt(m.floor)} m² podłogi · ${fmt(m.netWalls)} m² ścian netto · ${fmt(m.ceiling)} m² sufitu</div>${r.works.length?r.works.map(w=>`<div class="summary-work"><span>${esc(w.service)}</span><b>${fmt(w.qty)} ${esc(w.unit)}</b></div>`).join(''):'<div class="small muted">Brak zakresu prac</div>'}${r.notes?`<div class="work-note" style="margin-top:9px">📝 ${esc(r.notes)}</div>`:''}</div></div>`}).join('')}
<div class="card"><b>Co dalej?</b><div class="meta" style="margin-bottom:12px">W wersji 0.2 dane zostają na urządzeniu i aplikacja może działać offline. Połączenie z Kalkulatorem INSTIVIO zrobimy na końcu.</div><div class="inline2"><button class="btn secondary" onclick="exportJson()">⇩ Eksport JSON</button><button class="btn primary" onclick="go('job')">Edytuj oględziny</button></div></div>`}
function exportJson(){const j=job();if(!j)return;const clean=JSON.parse(JSON.stringify(j));clean.rooms.forEach(r=>r.photos=(r.photos||[]).map(p=>({id:p.id,name:p.name})));const blob=new Blob([JSON.stringify(clean,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${j.number.replaceAll('/','-')}-${(j.client||'klient').replace(/\s+/g,'_')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function deleteJob(){if(!confirm('Usunąć całe oględziny?'))return;state.jobs=state.jobs.filter(x=>x.id!==currentJobId);currentJobId=null;save();go('home')}
function loadDemo(){let j={id:uid(),number:'OGL/'+new Date().getFullYear()+'/DEMO',client:'Jan Kowalski',phone:'500 600 700',address:'Wadowice, ul. Przykładowa 12',visitDate:today(),plannedStart:'',notes:'Remont salonu i korytarza. 2 piętro, jest winda.',createdAt:new Date().toISOString(),rooms:[]};let r={id:uid(),name:'Salon',length:'4.20',width:'3.60',height:'2.60',notes:'Ściana przy oknie ma odchyłkę ok. 3 cm.',openings:[{type:'Okno',width:'1.50',height:'1.40',count:'1'},{type:'Drzwi',width:'.90',height:'2.05',count:'1'}],photos:[],works:[]};let m=metrics(r);r.works=[{id:uid(),category:'Gładzie',service:'Gładź gipsowa – 2 warstwy + szlifowanie',qty:m.netWalls,unit:'m²',note:'',basis:'walls'},{id:uid(),category:'Malowanie',service:'Malowanie ścian – 2 warstwy, 1 kolor',qty:m.netWalls,unit:'m²',note:'',basis:'walls'},{id:uid(),category:'Podłogi',service:'Układanie paneli podłogowych – click',qty:m.floor,unit:'m²',note:'',basis:'floor'}];j.rooms.push(r);state.jobs.unshift(j);currentJobId=j.id;save();go('job')}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.nav));
if('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window.addEventListener('online',updatePWAStatus);
window.addEventListener('offline',updatePWAStatus);
render();
</script>
</body>
</html>
