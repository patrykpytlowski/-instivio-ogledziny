function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:0}
function fmt(v){return (Math.round((num(v)+Number.EPSILON)*100)/100).toFixed(2).replace('.',',')}
function job(){return state.jobs.find(j=>j.id===currentJobId)}
function room(){const j=job();return j?.rooms.find(r=>r.id===currentRoomId)}
function metrics(r){const L=num(r.length),W=num(r.width),H=num(r.height);const floor=L*W, ceiling=floor, perimeter=2*(L+W), grossWalls=perimeter*H;const openings=(r.openings||[]).reduce((s,o)=>s+num(o.width)*num(o.height)*Math.max(1,num(o.count)),0);return{floor,ceiling,perimeter,grossWalls,openings,netWalls:Math.max(0,grossWalls-openings),wallsceil:Math.max(0,grossWalls-openings)+ceiling}}
function basisQty(r,b){const m=metrics(r);const doors=(r.openings||[]).filter(o=>String(o.type).toLowerCase().includes('drzwi')).reduce((s,o)=>s+num(o.width)*Math.max(1,num(o.count)),0);return b==='walls'?m.netWalls:b==='ceiling'?m.ceiling:b==='floor'?m.floor:b==='perimeter'?Math.max(0,m.perimeter-doors):b==='wallsceil'?m.wallsceil:0}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),1800)}
function flashSaved(){document.querySelectorAll('.save-pill').forEach(x=>{x.classList.add('show');setTimeout(()=>x.classList.remove('show'),800)})}
function go(screen){if(screen==='job'&&!currentJobId){newJob();return} if(screen==='summary'&&!currentJobId){toast('Najpierw wybierz zlecenie');screen='home'} currentScreen=screen;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(screen).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.nav===screen));render()}
function newJob(){const j={id:uid(),number:'OGL/'+new Date().getFullYear()+'/'+String(state.jobs.length+1).padStart(3,'0'),client:'',phone:'',address:'',visitDate:today(),plannedStart:'',notes:'',rooms:[],createdAt:new Date().toISOString()};state.jobs.unshift(j);currentJobId=j.id;save();currentScreen='job';go('job')}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function updatePWAStatus(){
 const net=document.getElementById('netState'); if(net) net.textContent=navigator.onLine?'online':'offline';
 const hint=document.getElementById('installHint'); if(!hint)return;
 if(isStandalone()){hint.innerHTML='✓ Aplikacja jest uruchomiona z ekranu początkowego.';return}
 if(isIOS()){hint.innerHTML='Na iPhonie: otwórz tę stronę w <b>Safari</b> → <b>Udostępnij</b> → <b>Dodaj do ekranu początkowego</b>.'}
 else{hint.innerHTML='W przeglądarce wybierz opcję <b>Zainstaluj aplikację</b> / <b>Dodaj do ekranu głównego</b>.'}
}
function render(){renderHome();renderJob();renderRoom();renderSummary();updatePWAStatus()}

el.querySelectorAll('[data-j]').forEach(i=>i.addEventListener('input',e=>{j[e.target.dataset.j]=e.target.value;save();if(e.target.dataset.j==='client')document.querySelector('.page-head h1').textContent=e.target.value||'Nowe oględziny'}))}

function wireRoomFields(){const r=room();document.querySelectorAll('[data-r]').forEach(i=>i.addEventListener('input',e=>{r[e.target.dataset.r]=e.target.value;save();updateRoomMetrics()}))}
function updateRoomMetrics(){const r=room();if(!r)return;const m=metrics(r);const vals={floor:m.floor,ceiling:m.ceiling,grossWalls:m.grossWalls,netWalls:m.netWalls};document.querySelectorAll('[data-metric]').forEach(el=>{const k=el.dataset.metric;if(k in vals)el.textContent=fmt(vals[k])+' m²'});const pv=document.getElementById('planView');if(pv)pv.innerHTML=planSVG(r)}
function addOpening(){const r=room();const type=prompt('Typ otworu: okno / drzwi','Okno');if(type===null)return;const width=prompt('Szerokość [m]','1.50');if(width===null)return;const height=prompt('Wysokość [m]','1.40');if(height===null)return;const count=prompt('Ilość','1');r.openings.push({type:type||'Otwór',width,height,count:count||'1'});save();renderRoom()}
function removeOpening(i){room().openings.splice(i,1);save();renderRoom()}
function wireWorkSelectors(){const cat=document.getElementById('workCat'),svc=document.getElementById('workService');if(!cat||!svc)return;const refresh=()=>{svc.innerHTML=catalog[cat.value].map((s,i)=>`<option value="${i}">${esc(s.n)}</option>`).join('');const c=document.getElementById('serviceCount');if(c)c.textContent=catalog[cat.value].length+' usług z bazy INSTIVIO';syncWork()};cat.onchange=refresh;svc.onchange=syncWork;refresh()}
function syncWork(){const cat=document.getElementById('workCat'),svc=document.getElementById('workService'),q=document.getElementById('workQty'),u=document.getElementById('workUnit'),box=document.getElementById('autoSuggest');if(!cat||!svc)return;const s=catalog[cat.value][Number(svc.value)||0];u.value=s.u;const auto=basisQty(room(),s.b);if(auto>0){q.value=fmt(auto);const labels={walls:'ściany netto',ceiling:'sufit',floor:'podłoga',perimeter:'obwód pomniejszony o drzwi',wallsceil:'ściany netto + sufit'};box.innerHTML=`<div class="auto-box"><b>Automatyczna ilość: ${fmt(auto)} ${s.u}</b><div class="small">Na podstawie: ${labels[s.b]||'pomiar'}. Możesz ją ręcznie zmienić.</div></div>`}else{q.value='';box.innerHTML='<div class="auto-box"><b>Ilość ręczna</b><div class="small">Ta usługa nie ma jeszcze automatycznego przelicznika.</div></div>'}}
function addWork(){const cat=document.getElementById('workCat'),svc=document.getElementById('workService'),q=document.getElementById('workQty'),u=document.getElementById('workUnit'),note=document.getElementById('workNote');const s=catalog[cat.value][Number(svc.value)||0],qty=num(q.value);if(!qty){toast('Wpisz ilość');return}room().works.push({id:uid(),category:cat.value,service:s.n,qty,unit:s.u,note:note.value||'',basis:s.b});save();toast('Dodano pozycję');renderRoom()}
function removeWork(i){room().works.splice(i,1);save();renderRoom()}

const pointTypes=[
 {k:'socket',n:'Gniazdo',prefix:'G',variants:['1× pojedyncze','2× podwójne','3× potrójne','4× poczwórne','5×','Inne']},
 {k:'switch',n:'Włącznik',prefix:'W',variants:['pojedynczy','podwójny','potrójny','Inny']},
 {k:'tv',n:'TV / LAN',prefix:'TV',variants:['TV','LAN','TV + LAN']},
 {k:'light',n:'Punkt oświetleniowy',prefix:'L',variants:['ścienny','sufitowy']},
 {k:'water',n:'Punkt wod-kan',prefix:'WK',variants:['zimna woda','ciepła + zimna','odpływ','woda + odpływ']},
 {k:'radiator',n:'Grzejnik',prefix:'GR',variants:['grzejnik']},
 {k:'washer',n:'Pralka / zmywarka',prefix:'AGD',variants:['pralka','zmywarka','suszarka']},
 {k:'vent',n:'Kratka wentylacyjna',prefix:'K',variants:['kratka']},
 {k:'opening',n:'Otwór / rewizja / przepust',prefix:'O',variants:['otwór','rewizja','przepust']},
 {k:'custom',n:'Inny element',prefix:'X',variants:['inny']}
];
function ensureProject(r){if(!r.projectPoints)r.projectPoints=[];return r.projectPoints}
function wallLength(r,w){return (w==='A'||w==='C')?num(r.length):num(r.width)}
function nextPointLabel(r,t){const def=pointTypes.find(x=>x.k===t)||pointTypes.at(-1);const n=ensureProject(r).filter(p=>p.type===t).length+1;return def.prefix+n}
function socketDivisions(p){if(p.type!=='socket')return 1;const m=String(p.variant||'').match(/^(\d+)/);return m?Math.max(1,Number(m[1])):1}
function symbolSVG(p,x,y,w=30,h=18){const div=socketDivisions(p);let lines='';for(let i=1;i<div;i++)lines+=`<line x1="${x+w*i/div}" y1="${y}" x2="${x+w*i/div}" y2="${y+h}" stroke="#0d3563" stroke-width="1"/>`;return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#fff" stroke="#0d3563" stroke-width="2"/>${lines}<text x="${x+w/2}" y="${y-4}" text-anchor="middle" font-size="10" font-weight="700" fill="#0d3563">${esc(p.label)}</text></g>`}
function planSVG(r){const L=num(r.length),W=num(r.width);if(!L||!W)return '<div class="empty small">Wpisz długość i szerokość, aby utworzyć rzut.</div>';const vw=520,vh=330,pad=55,availW=vw-pad*2,availH=vh-pad*2,sc=Math.min(availW/L,availH/W),rw=L*sc,rh=W*sc,x=(vw-rw)/2,y=(vh-rh)/2;let s=`<svg class="plan-svg" viewBox="0 0 ${vw} ${vh}" aria-label="Rzut 2D"><rect x="${x}" y="${y}" width="${rw}" height="${rh}" fill="#fff" stroke="#0d3563" stroke-width="5"/><text x="${vw/2}" y="${y-17}" text-anchor="middle" font-size="13" font-weight="800" fill="#0d3563">A · ${fmt(L)} m</text><text x="${x+rw+24}" y="${vh/2}" text-anchor="middle" font-size="13" font-weight="800" fill="#0d3563">B</text><text x="${vw/2}" y="${y+rh+28}" text-anchor="middle" font-size="13" font-weight="800" fill="#0d3563">C</text><text x="${x-24}" y="${vh/2}" text-anchor="middle" font-size="13" font-weight="800" fill="#0d3563">D</text>`;for(const p of ensureProject(r)){const wl=wallLength(r,p.wall)||1,pos=Math.max(0,Math.min(wl,num(p.fromLeft)));let px=x,py=y;if(p.wall==='A'){px=x+(pos/wl)*rw;py=y}else if(p.wall==='B'){px=x+rw;py=y+(pos/wl)*rh}else if(p.wall==='C'){px=x+rw-(pos/wl)*rw;py=y+rh}else{px=x;py=y+rh-(pos/wl)*rh}s+=`<circle cx="${px}" cy="${py}" r="8" fill="#f4bd24" stroke="#0d3563" stroke-width="2"/><text x="${px}" y="${py-12}" text-anchor="middle" font-size="10" font-weight="800" fill="#0d3563">${esc(p.label)}</text>`}return s+'</svg>'}
function pointRow(p,i){return `<div class="point-card"><div class="row"><span class="point-symbol">${p.type==='socket'?Array(socketDivisions(p)).fill('□').join(''):esc(p.label)}</span><div class="grow"><b>${esc(p.label)} · ${esc((pointTypes.find(x=>x.k===p.type)||{}).n||p.type)} ${esc(p.variant||'')}</b><div class="meta">Ściana ${esc(p.wall)} · ${fmt(p.fromLeft)} m od lewej · ${fmt(p.height)} m od podłogi${p.width&&p.objHeight?` · ${fmt(p.width)}×${fmt(p.objHeight)} m`:''}</div></div><button class="icon-btn danger" onclick="removePoint(${i})">×</button></div></div>`}
function openPointModal(){const r=room();ensureProject(r);const back=document.createElement('div');back.className='modal-back';back.id='pointModal';back.innerHTML=`<div class="modal"><h2>Dodaj element do projektu</h2><div class="field"><label>Typ</label><select id="ptType">${pointTypes.map(x=>`<option value="${x.k}">${x.n}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Wariant</label><select id="ptVariant"></select></div><div class="inline2" style="margin-top:10px"><div class="field"><label>Ściana</label><select id="ptWall"><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div class="field"><label>Od lewej [m]</label><input id="ptX" inputmode="decimal" placeholder="0,50"></div></div><div class="inline2" style="margin-top:10px"><div class="field"><label>Od podłogi [m]</label><input id="ptY" inputmode="decimal" placeholder="0,30"></div><div class="field"><label>Opis własny</label><input id="ptNote" placeholder="opcjonalnie"></div></div><div id="sizeFields" class="inline2" style="margin-top:10px;display:none"><div class="field"><label>Szerokość elementu / otworu [m]</label><input id="ptW" inputmode="decimal" placeholder="0,20"></div><div class="field"><label>Wysokość elementu / otworu [m]</label><input id="ptH" inputmode="decimal" placeholder="0,30"></div></div><div class="inline2" style="margin-top:16px"><button class="btn secondary" onclick="closePointModal()">Anuluj</button><button class="btn primary" onclick="savePoint()">Dodaj</button></div></div>`;document.body.appendChild(back);const t=document.getElementById('ptType'),v=document.getElementById('ptVariant'),sf=document.getElementById('sizeFields');const ref=()=>{const d=pointTypes.find(x=>x.k===t.value);v.innerHTML=d.variants.map(x=>`<option>${x}</option>`).join('');sf.style.display=['vent','opening','radiator','washer','custom'].includes(t.value)?'grid':'none'};t.onchange=ref;ref()}
function closePointModal(){document.getElementById('pointModal')?.remove()}
function savePoint(){const r=room(),type=document.getElementById('ptType').value,wall=document.getElementById('ptWall').value,x=num(document.getElementById('ptX').value),y=num(document.getElementById('ptY').value),wl=wallLength(r,wall);if(x>wl){toast('Odległość jest większa niż długość ściany');return}const p={id:uid(),type,label:nextPointLabel(r,type),variant:document.getElementById('ptVariant').value,wall,fromLeft:x,height:y,note:document.getElementById('ptNote').value,width:num(document.getElementById('ptW')?.value),objHeight:num(document.getElementById('ptH')?.value)};ensureProject(r).push(p);save();closePointModal();renderRoom()}
function removePoint(i){ensureProject(room()).splice(i,1);save();renderRoom()}
let wallViewOn=false,activeWall='A';
function toggleWallView(){wallViewOn=!wallViewOn;renderWallArea()}
function setWall(w){activeWall=w;renderWallArea()}
function renderWallArea(){const a=document.getElementById('wallArea'),r=room();if(!a)return;if(!wallViewOn){a.innerHTML='';return}a.innerHTML=`<div class="wall-tabs">${['A','B','C','D'].map(w=>`<button class="wall-tab ${w===activeWall?'active':''}" onclick="setWall('${w}')">Ściana ${w}</button>`).join('')}</div><div class="wall-view">${wallSVG(r,activeWall)}</div>`}
function wallSVG(r,w){const L=wallLength(r,w),H=num(r.height);if(!L||!H)return '<div class="empty small">Brak wymiarów ściany.</div>';const vw=520,vh=300,p=48,sc=Math.min((vw-p*2)/L,(vh-p*2)/H),rw=L*sc,rh=H*sc,x=(vw-rw)/2,y=(vh-rh)/2;let s=`<svg class="plan-svg" viewBox="0 0 ${vw} ${vh}"><rect x="${x}" y="${y}" width="${rw}" height="${rh}" fill="#fff" stroke="#0d3563" stroke-width="3"/><text x="${vw/2}" y="${y-16}" text-anchor="middle" font-size="13" font-weight="800" fill="#0d3563">ŚCIANA ${w} · ${fmt(L)} × ${fmt(H)} m</text>`;for(const q of ensureProject(r).filter(q=>q.wall===w)){const px=x+(Math.min(L,num(q.fromLeft))/L)*rw,py=y+rh-(Math.min(H,num(q.height))/H)*rh;const ww=q.width?Math.max(18,q.width*sc):30,hh=q.objHeight?Math.max(14,q.objHeight*sc):18;s+=symbolSVG(q,px-ww/2,py-hh/2,ww,hh)+`<text x="${px}" y="${Math.min(vh-8,py+hh/2+14)}" text-anchor="middle" font-size="9" fill="#687387">${fmt(q.fromLeft)} / ${fmt(q.height)} m</text>`}return s+'</svg>'}

async function addPhotos(files){const r=room();for(const f of [...files].slice(0,6)){try{const data=await compressImage(f);r.photos.push({id:uid(),name:f.name,data})}catch(e){toast('Nie udało się dodać zdjęcia')}}try{save()}catch(e){toast('Pamięć telefonu jest pełna dla zdjęć')}renderRoom()}
function compressImage(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onerror=reject;fr.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.68))};img.src=fr.result};fr.readAsDataURL(file)})}
function removePhoto(i){room().photos.splice(i,1);save();renderRoom()}
function renderSummary(){const el=document.getElementById('summary'),j=job();if(!j){el.innerHTML='<div class="card empty"><b>Brak wybranego zlecenia</b></div>';return}const totalWorks=j.rooms.reduce((s,r)=>s+r.works.length,0);el.innerHTML=`
<div class="page-head"><button class="back" onclick="go('job')">‹</button><div class="grow"><h1>Podsumowanie</h1><div class="meta">${esc(j.client||j.number)}</div></div><span class="save-pill">Zapisano</span></div>
<div class="steps"><div class="step done">1. Klient</div><div class="step done">2. Pomieszczenia</div><div class="step active">3. Podsumowanie</div></div>
<div class="card"><div class="row between"><div><b>${esc(j.client||'Klient')}</b><div class="meta">${esc(j.address||'Brak adresu')} · ${esc(j.phone||'brak telefonu')}</div></div><span class="chip yellow">${esc(j.number)}</span></div><div class="chips"><span class="chip">${j.rooms.length} pomieszczeń</span><span class="chip">${totalWorks} pozycji prac</span><span class="chip">${j.rooms.reduce((s,r)=>s+r.photos.length,0)} zdjęć</span></div></div>
${j.rooms.map(r=>{const m=metrics(r);return`<div class="card"><div class="summary-room"><h3>${esc(r.name)}</h3><div class="dims">${fmt(m.floor)} m² podłogi · ${fmt(m.netWalls)} m² ścian netto · ${fmt(m.ceiling)} m² sufitu</div>${r.works.length?r.works.map(w=>`<div class="summary-work"><span>${esc(w.service)}</span><b>${fmt(w.qty)} ${esc(w.unit)}</b></div>`).join(''):'<div class="small muted">Brak zakresu prac</div>'}${r.notes?`<div class="work-note" style="margin-top:9px">📝 ${esc(r.notes)}</div>`:''}</div></div>`}).join('')}
<div class="card"><b>Co dalej?</b><div class="meta" style="margin-bottom:12px">W wersji 0.3 dane zostają na urządzeniu i aplikacja może działać offline. Połączenie z Kalkulatorem INSTIVIO zrobimy na końcu.</div><div class="inline2"><button class="btn secondary" onclick="exportJson()">⇩ Eksport JSON</button><button class="btn primary" onclick="go('job')">Edytuj oględziny</button></div></div>`}
function exportJson(){const j=job();if(!j)return;const clean=JSON.parse(JSON.stringify(j));clean.rooms.forEach(r=>r.photos=(r.photos||[]).map(p=>({id:p.id,name:p.name})));const blob=new Blob([JSON.stringify(clean,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${j.number.replaceAll('/','-')}-${(j.client||'klient').replace(/\s+/g,'_')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function deleteJob(){if(!confirm('Usunąć całe oględziny?'))return;state.jobs=state.jobs.filter(x=>x.id!==currentJobId);currentJobId=null;save();go('home')}
function loadDemo(){let j={id:uid(),number:'OGL/'+new Date().getFullYear()+'/DEMO',client:'Jan Kowalski',phone:'500 600 700',address:'Wadowice, ul. Przykładowa 12',visitDate:today(),plannedStart:'',notes:'Remont salonu i korytarza. 2 piętro, jest winda.',createdAt:new Date().toISOString(),rooms:[]};let r={id:uid(),name:'Salon',length:'4.20',width:'3.60',height:'2.60',notes:'Ściana przy oknie ma odchyłkę ok. 3 cm.',openings:[{type:'Okno',width:'1.50',height:'1.40',count:'1'},{type:'Drzwi',width:'.90',height:'2.05',count:'1'}],photos:[],projectPoints:[{id:uid(),type:'socket',label:'G1',variant:'2× podwójne',wall:'A',fromLeft:.5,height:.3,note:'',width:0,objHeight:0},{id:uid(),type:'vent',label:'K1',variant:'kratka',wall:'B',fromLeft:1.2,height:2.1,note:'',width:.2,objHeight:.3}],works:[]};let m=metrics(r);r.works=[{id:uid(),category:'Gładzie',service:'Gładź gipsowa – 2 warstwy + szlifowanie',qty:m.netWalls,unit:'m²',note:'',basis:'walls'},{id:uid(),category:'Malowanie',service:'Malowanie ścian – 2 warstwy, 1 kolor',qty:m.netWalls,unit:'m²',note:'',basis:'walls'},{id:uid(),category:'Podłogi',service:'Układanie paneli podłogowych – click',qty:m.floor,unit:'m²',note:'',basis:'floor'}];j.rooms.push(r);state.jobs.unshift(j);currentJobId=j.id;save();go('job')}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.nav));
if('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window.addEventListener('online',updatePWAStatus);
window.addEventListener('offline',updatePWAStatus);
render();
</script>
